<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>AgeNow — promo</title>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@400;500;700;900&family=Rubik:wght@900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0e17; --surface: #1a1830; --card: #211f35;
    --accent: #f7a823; --accent2: #e84393; --pink: #ff4d8d;
    --cream: #fdf4e3; --text: #fffffe; --muted: #a7a9be;
  }
  html, body { width: 540px; height: 960px; overflow: hidden; background: var(--bg); }
  body { font-family: 'Heebo', sans-serif; color: var(--text); position: relative; }
  .layer { position: absolute; inset: 0; }

  /* Background */
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.28; }
  #b1 { width: 420px; height: 420px; background: var(--accent); }
  #b2 { width: 380px; height: 380px; background: var(--accent2); }
  #b3 { width: 280px; height: 280px; background: #6c63ff; }

  /* Hook */
  #hook { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center; padding: 0 30px; }
  #hook .q { font-family: 'Secular One', sans-serif; font-size: 64px; line-height: 1.1; }
  #hook .a { font-family: 'Secular One', sans-serif; font-size: 46px; color: var(--accent); }
  #hook .a b { color: var(--pink); font-weight: normal; }

  /* Clock (shared) */
  .clock circle.face { fill: var(--cream); stroke: var(--bg); }

  /* Logo */
  #logo { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; }
  #logo .icon { width: 300px; height: 300px; border-radius: 68px; background: var(--accent);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    font-family: 'Rubik', sans-serif; color: var(--bg); box-shadow: 0 30px 90px rgba(247,168,35,0.45); }
  #logo .w { font-size: 92px; font-weight: 900; line-height: 0.74; letter-spacing: -3px; }
  #logo .row { display: flex; align-items: center; gap: 3px; direction: ltr; }
  #logo .name { font-family: 'Secular One', sans-serif; font-size: 58px; color: var(--accent); direction: ltr; }

  /* Phone */
  #phone { position: absolute; left: 95px; top: 64px; width: 350px; height: 660px; border-radius: 52px;
    background: #05050a; padding: 12px; box-shadow: 0 40px 120px rgba(0,0,0,0.7), 0 0 0 2px #2c2a40; }
  #screen { position: relative; width: 100%; height: 100%; border-radius: 41px; overflow: hidden; background: var(--bg); }
  #screen .glow1 { position: absolute; width: 260px; height: 260px; border-radius: 50%; background: var(--accent); filter: blur(60px); opacity: 0.16; top: -70px; right: -80px; }
  #screen .glow2 { position: absolute; width: 230px; height: 230px; border-radius: 50%; background: var(--accent2); filter: blur(60px); opacity: 0.16; bottom: -60px; left: -70px; }
  .app { position: relative; padding: 52px 18px 0; }
  .app header { text-align: center; margin-bottom: 20px; }
  .app h1 { font-family: 'Secular One', sans-serif; font-size: 30px; color: var(--accent); text-shadow: 0 0 24px rgba(247,168,35,0.35);
    display: flex; align-items: center; justify-content: center; gap: 8px; }
  .app .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .tabs-row { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; min-height: 36px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .tab { background: var(--surface); color: var(--muted); border-radius: 40px; padding: 5px 12px; font-size: 13px; white-space: nowrap; border: 2px solid transparent; }
  .tab.active { background: var(--accent); color: var(--bg); font-weight: 700; box-shadow: 0 0 14px rgba(247,168,35,0.4); }
  .add { width: 36px; height: 36px; border-radius: 50%; background: var(--cream); color: var(--bg); font-size: 24px; font-weight: 700; line-height: 36px; text-align: center; flex-shrink: 0; box-shadow: 0 0 14px rgba(253,244,227,0.25); }
  .card { background: var(--card); border-radius: 18px; border: 1px solid rgba(255,255,255,0.07); padding: 26px 14px; min-height: 300px;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
  .empty { text-align: center; color: var(--muted); font-size: 15px; }
  .empty .ic { width: 52px; height: 52px; border-radius: 50%; background: var(--surface); margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; }
  .person { text-align: center; width: 100%; }
  .avatar { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); margin: 0 auto 10px;
    display: flex; align-items: center; justify-content: center; font-family: 'Secular One', sans-serif; font-size: 28px; color: var(--bg); box-shadow: 0 0 20px rgba(247,168,35,0.3); }
  .person h2 { font-family: 'Secular One', sans-serif; font-size: 25px; margin-bottom: 16px; }
  .blocks { display: flex; justify-content: center; align-items: center; gap: 6px; margin-bottom: 14px; }
  .blk { display: flex; flex-direction: column; align-items: center; background: var(--surface); border-radius: 12px; padding: 10px 6px; min-width: 76px; border: 1px solid rgba(255,255,255,0.08); }
  .num { font-family: 'Secular One', sans-serif; font-size: 34px; color: var(--accent); line-height: 1; }
  .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .sep { color: var(--muted); opacity: 0.5; font-size: 20px; }
  .born { color: var(--muted); font-size: 12px; }

  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.65); display: flex; align-items: center; justify-content: center; padding: 0 22px; }
  .modal { width: 100%; background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 22px 18px; box-shadow: 0 16px 60px rgba(0,0,0,0.6); }
  .modal h3 { font-family: 'Secular One', sans-serif; font-size: 20px; color: var(--accent); margin-bottom: 16px; }
  .field { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .input { margin-top: 5px; background: var(--surface); border: 1.5px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 9px 12px; color: var(--text); font-size: 16px; height: 42px; display: flex; align-items: center; }
  .input.focus { border-color: var(--accent); }
  .caret { display: inline-block; width: 2px; height: 20px; background: var(--accent); margin-right: 2px; }
  .actions { display: flex; gap: 10px; margin-top: 6px; }
  .btn { flex: 1; border-radius: 10px; padding: 10px; text-align: center; font-size: 15px; }
  .btn.ok { background: var(--accent); color: var(--bg); font-weight: 700; }
  .btn.no { border: 1.5px solid rgba(255,255,255,0.15); color: var(--muted); }

  .toast { position: absolute; left: 50%; bottom: 40px; background: var(--accent); color: var(--bg); font-family: 'Secular One', sans-serif;
    font-size: 16px; padding: 11px 22px; border-radius: 40px; white-space: nowrap; box-shadow: 0 8px 30px rgba(247,168,35,0.45); }

  .tap { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(247,168,35,0.3); border: 2px solid rgba(247,168,35,0.95); pointer-events: none; }

  /* Privacy */
  #privacy { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; text-align: center; padding: 0 40px; }
  #privacy .t1 { font-family: 'Secular One', sans-serif; font-size: 48px; line-height: 1.15; }
  #privacy .t1 span { color: var(--accent); }

  /* End card */
  #end { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center; }
  #end .icon { width: 220px; height: 220px; border-radius: 50px; background: var(--accent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 13px;
    font-family: 'Rubik', sans-serif; color: var(--bg); box-shadow: 0 26px 80px rgba(247,168,35,0.45); }
  #end .w { font-size: 68px; font-weight: 900; line-height: 0.74; letter-spacing: -2px; }
  #end .row { display: flex; align-items: center; gap: 2px; direction: ltr; }
  #end .tag { font-family: 'Secular One', sans-serif; font-size: 40px; }
  #end .tag span { color: var(--accent); }

  /* Captions */
  #cap { position: absolute; left: 30px; right: 30px; bottom: 74px; text-align: center; }
  #cap span { display: inline-block; font-family: 'Heebo', sans-serif; font-weight: 700; font-size: 25px; line-height: 1.35; color: #fff;
    background: rgba(15,14,23,0.78); padding: 8px 18px; border-radius: 14px; }
</style>
</head>
<body>
  <div class="layer" id="bgl">
    <div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div>
  </div>

  <div class="layer" id="hook">
    <div class="q" id="hq">בני כמה אתם היום?</div>
    <svg class="clock" id="hclock" width="150" height="150" viewBox="0 0 116 116" style="filter: drop-shadow(0 0 22px rgba(247,168,35,0.55))">
      <circle class="face" cx="58" cy="58" r="47" stroke-width="16" />
      <line id="hh" x1="58" y1="58" x2="58" y2="30" stroke="#0f0e17" stroke-width="10" stroke-linecap="round" />
      <line id="hm" x1="58" y1="58" x2="58" y2="22" stroke="#ff4d8d" stroke-width="8" stroke-linecap="round" />
      <circle cx="58" cy="58" r="7" fill="#0f0e17" />
    </svg>
    <div class="a" id="ha">לא בערך — <b>בדיוק.</b></div>

  <div class="layer" id="logo">
    <div class="icon" id="licon">
      <div class="w">AGE</div>
      <div class="row">
        <div class="w">N</div>
        <svg class="clock" width="72" height="72" viewBox="0 0 116 116">
          <circle class="face" cx="58" cy="58" r="47" stroke-width="20" />
          <line x1="58" y1="58" x2="58" y2="30" stroke="#0f0e17" stroke-width="10" stroke-linecap="round" />
          <line id="lm" x1="58" y1="58" x2="78" y2="68" stroke="#ff4d8d" stroke-width="10" stroke-linecap="round" />
          <circle cx="58" cy="58" r="7" fill="#0f0e17" />
        </svg>
        <div class="w">W</div>
      </div>
    </div>
    <div class="name" id="lname">AgeNow</div>
  </div>

  <div id="phone">
    <div id="screen">
      <div class="glow1"></div><div class="glow2"></div>
      <div class="app">
        <header>
          <h1>
            <svg class="clock" width="28" height="28" viewBox="0 0 116 116">
              <circle class="face" cx="58" cy="58" r="47" stroke-width="16" />
              <line x1="58" y1="58" x2="58" y2="28" stroke="#0f0e17" stroke-width="11" stroke-linecap="round" />
              <line x1="58" y1="58" x2="80" y2="69" stroke="#ff4d8d" stroke-width="11" stroke-linecap="round" />
              <circle cx="58" cy="58" r="8" fill="#0f0e17" />
            </svg>
            AgeNow
          </h1>
          <div class="sub">הוסף אנשים וגלה את גילם המדויק</div>
        </header>

              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#a7a9be" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 4-6 8-6s8 2 8 6" /></svg>

              <div class="blk"><span class="num" id="ny"></span><span class="lbl">שנים</span></div>

          <h3>➕ הוסף אדם חדש</h3>
          <div class="field">שם<div class="input" id="in1"></div></div>
          <div class="field">תאריך לידה<div class="input" id="in2" style="direction: ltr; justify-content: flex-end"></div></div>
          <div class="actions"><div class="btn ok" id="okbtn">הוסף</div><div class="btn no">ביטול</div></div>

  <div class="layer" id="privacy">

      <rect x="4" y="10" width="16" height="11" rx="2.5" fill="rgba(247,168,35,0.12)" />
      <path d="M8 10V7a4 4 0 0 1 8 0v3" />
      <circle cx="12" cy="15.5" r="1.6" fill="#f7a823" />
    </svg>

        <svg class="clock" width="54" height="54" viewBox="0 0 116 116">
          <circle class="face" cx="58" cy="58" r="47" stroke-width="20" />
          <line x1="58" y1="58" x2="58" y2="30" stroke="#0f0e17" stroke-width="10" stroke-linecap="round" />
          <line id="em" x1="58" y1="58" x2="78" y2="68" stroke="#ff4d8d" stroke-width="10" stroke-linecap="round" />
          <circle cx="58" cy="58" r="7" fill="#0f0e17" />

      </div>
    </div>

  </div>

  <div id="cap"><span id="capt"></span></div>

<script>
// ── Timeline (seconds). Tuned to the voiceover; see promo/README.md ─────────
const T = window.TIMING || {
  hookQ: 0.0, hookA: 1.85, logo: 3.9, phone: 5.3,
  tapPlus: 6.2, typeName: 6.95, typeDate: 7.5, tapAdd: 8.7,
  result: 8.9, adds: [12.55, 14.75, 15.45, 16.4], privacy: 17.85, end: 20.6, total: 25.0,
};
const CAPTIONS = window.CAPTIONS || [
  [4.0, 5.5, 'הכירו את AgeNow'],
  [5.55, 8.6, 'לוחצים על הפלוס, כותבים שם ותאריך לידה…'],
  [8.85, 12.25, 'ובום! שנים, חודשים וימים — ברגע אחד'],
  [12.4, 16.1, 'מוסיפים עד 5 אנשים: הילדים, בן הזוג, סבתא'],
  [16.1, 17.75, 'כל אחד בלשונית משלו'],
  [17.85, 20.55, 'והכול נשמר רק אצלכם, בטלפון'],
]; // on-screen text already says the hook and the end card, so no captions there

const PEOPLE = [
  { name: 'נועה', born: '14/03/2016', age: [10, 7, 6] },
  { name: 'איתי', born: '02/07/2012', age: [14, 3, 18] },
  { name: 'יואב', born: '23/11/1988', age: [37, 10, 27] },
  { name: 'סבתא רחל', born: '05/01/1951', age: [75, 9, 15] },
  { name: 'אני', born: '08/08/1990', age: [36, 2, 12] },
];

const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => clamp((t - a) / d);
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const back = p => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
// visible between a and b with fade in/out of f seconds
const win = (t, a, b, f = 0.35) => Math.min(prog(t, a, f), 1 - prog(t, b - f, f));

function setLayer(el, o, y = 0, s = 1) {
  el.style.opacity = o;
  el.style.visibility = o <= 0.001 ? 'hidden' : 'visible';
  el.style.transform = `translateY(${y}px) scale(${s})`;
}

function rotateHand(el, deg, len) {
  const r = deg * Math.PI / 180;
  el.setAttribute('x2', 58 + Math.sin(r) * len);
  el.setAttribute('y2', 58 - Math.cos(r) * len);
}

function render(t) {
  // background drift
  $('b1').style.transform = `translate(${260 + 40 * Math.sin(t * 0.5)}px, ${-120 + 30 * Math.cos(t * 0.4)}px)`;
  $('b2').style.transform = `translate(${-140 + 30 * Math.cos(t * 0.45)}px, ${640 + 40 * Math.sin(t * 0.35)}px)`;
  $('b3').style.transform = `translate(${140 + 60 * Math.sin(t * 0.3)}px, ${360 + 50 * Math.cos(t * 0.5)}px)`;

  // 1. Hook
  const hook = win(t, T.hookQ, T.logo, 0.3);
  setLayer($('hook'), hook, 0, 1 + 0.04 * prog(t, T.hookQ, T.logo - T.hookQ));
  const pq = easeOut(prog(t, T.hookQ, 0.5));
  $('hq').style.opacity = pq; $('hq').style.transform = `translateY(${30 * (1 - pq)}px)`;
  const pa = back(prog(t, T.hookA, 0.45));
  $('ha').style.opacity = clamp(pa); $('ha').style.transform = `scale(${0.6 + 0.4 * pa})`;
  // hands spin fast, then snap to "now" when the answer lands
  const spin = 1 - easeOut(prog(t, T.hookA - 0.2, 0.6));
  rotateHand($('hm'), t * 900 * spin + 60 * (1 - spin), 36);
  rotateHand($('hh'), t * 75 * spin, 26);

  // 2. Logo
  const lo = win(t, T.logo, T.phone, 0.3);
  const pl = back(prog(t, T.logo, 0.6));
  setLayer($('logo'), lo);
  $('licon').style.transform = `scale(${0.5 + 0.5 * pl}) rotate(${-8 * (1 - clamp(pl))}deg)`;
  $('lname').style.opacity = easeOut(prog(t, T.logo + 0.35, 0.4));
  rotateHand($('lm'), 116 + 360 * (1 - easeOut(prog(t, T.logo, 1.2))), 22);

  // 3–5. Phone demo
  const ph = win(t, T.phone, T.privacy, 0.4);
  const pin = easeOut(prog(t, T.phone, 0.6));
  $('phone').style.opacity = ph;
  $('phone').style.visibility = ph <= 0.001 ? 'hidden' : 'visible';
  $('phone').style.transform = `translateY(${120 * (1 - pin)}px) scale(${0.92 + 0.08 * pin})`;
  renderApp(t);

  // 6. Privacy
  const pv = win(t, T.privacy, T.end, 0.35);
  setLayer($('privacy'), pv, 24 * (1 - easeOut(prog(t, T.privacy, 0.5))));

  // 7. End card
  const en = prog(t, T.end, 0.35);
  setLayer($('end'), en);
  const pe = back(prog(t, T.end, 0.6));
  $('eicon').style.transform = `scale(${0.6 + 0.4 * pe})`;
  $('etag').style.opacity = easeOut(prog(t, T.end + 0.4, 0.4));
  rotateHand($('em'), 116 + 360 * (1 - easeOut(prog(t, T.end, 1.2))), 22);

  // Captions
  const c = CAPTIONS.find(c => t >= c[0] && t < c[1]);
  $('cap').style.opacity = c ? Math.min(prog(t, c[0], 0.15), 1 - prog(t, c[1] - 0.15, 0.15)) : 0;
  if (c) $('capt').textContent = c[2];
}

// Positions inside #screen (px) for the tap indicator
const POS = { plus: [36, 172], add: [236, 435] };

function renderApp(t) {
  // which people exist and who is active
  const added = t >= T.tapAdd + 0.15 ? 1 : 0;
  let count = added;
  let active = 0;
  let switchAt = T.result;
  T.adds.forEach((at, i) => {
    if (t >= at) { count = i + 2; active = i + 1; switchAt = at; }
  });

  // tabs
  const tabs = $('tabs');
  if (tabs.childElementCount !== count || tabs.dataset.active !== String(active)) {
    tabs.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'tab' + (i === active ? ' active' : '');
      el.textContent = PEOPLE[i].name;
      tabs.appendChild(el);
    }
    tabs.dataset.active = String(active);
  }
  for (let i = 0; i < count; i++) {
    const at = i === 0 ? T.tapAdd + 0.15 : T.adds[i - 1];
    const p = back(prog(t, at, 0.35));
    tabs.children[i].style.transform = `scale(${0.4 + 0.6 * p})`;
    tabs.children[i].style.opacity = clamp(p * 2);
  }

  // plus button pulse before it's tapped, and again for each added tab
  const pulse = t < T.tapPlus ? 1 + 0.12 * Math.max(0, Math.sin((t - T.phone) * 8)) : 1;
  $('add').style.transform = `scale(${pulse})`;

  // card
  const hasPerson = count > 0;
  $('empty').style.display = hasPerson ? 'none' : 'block';
  $('person').style.display = hasPerson ? 'block' : 'none';
  if (hasPerson) {
    const p = PEOPLE[active];
    const k = easeOut(prog(t, switchAt + 0.05, 0.9));
    $('av').textContent = p.name[0];
    $('pname').textContent = p.name;
    $('ny').textContent = Math.round(p.age[0] * k);
    $('nm').textContent = Math.round(p.age[1] * k);
    $('nd').textContent = Math.round(p.age[2] * k);
    $('born').textContent = 'תאריך לידה: ' + p.born;
    const pop = back(prog(t, switchAt, 0.4));
    $('person').style.transform = `scale(${0.9 + 0.1 * pop})`;
    $('person').style.opacity = clamp(pop * 1.5);
  }

  // modal
  const mo = t >= T.tapPlus + 0.1 && t < T.tapAdd + 0.15;
  const mIn = easeOut(prog(t, T.tapPlus + 0.1, 0.3));
  $('overlay').style.display = mo ? 'flex' : 'none';
  $('overlay').style.opacity = mIn;
  $('modal').style.transform = `translateY(${30 * (1 - mIn)}px)`;
  const name = PEOPLE[0].name, date = PEOPLE[0].born;
  const nChars = Math.floor(clamp((t - T.typeName) / 0.6) * name.length);
  const dChars = Math.floor(clamp((t - T.typeDate) / 0.8) * date.length);
  const caret = Math.floor(t * 2.5) % 2 === 0 ? '<span class="caret"></span>' : '';
  const nameFocus = t < T.typeDate;
  $('in1').innerHTML = name.slice(0, nChars) + (nameFocus ? caret : '');
  $('in2').innerHTML = date.slice(0, dChars) + (!nameFocus ? caret : '');
  $('in1').classList.toggle('focus', nameFocus);
  $('in2').classList.toggle('focus', !nameFocus);
  $('okbtn').style.transform = `scale(${t >= T.tapAdd && t < T.tapAdd + 0.15 ? 0.94 : 1})`;

  // toast for the first result
  const toastOn = win(t, T.result + 0.2, T.adds[0] - 0.2, 0.25);
  const a = PEOPLE[0].age;
  $('toast').textContent = `גיל ${a[0]}, ${a[1]} חודשים, ${a[2]} ימים`;
  $('toast').style.opacity = toastOn;
  $('toast').style.transform = `translateX(-50%) translateY(${16 * (1 - toastOn)}px)`;

  // tap indicator
  const taps = [[T.tapPlus, POS.plus], [T.tapAdd, POS.add]];
  for (const at of T.adds) taps.push([at - 0.25, POS.plus]);
  const tap = $('tap');
  tap.style.opacity = 0;
  for (const [at, [x, y]] of taps) {
    const p = prog(t, at - 0.25, 0.55);
    if (p > 0 && p < 1) {
      tap.style.left = x + 'px'; tap.style.top = y + 'px';
      tap.style.opacity = Math.sin(p * Math.PI);
      tap.style.transform = `scale(${1.3 - 0.5 * Math.sin(p * Math.PI)})`;
    }
  }
}

window.render = render;
window.TOTAL = T.total;
render(Number(new URLSearchParams(location.search).get('t') || 0));
</script>
</body>
</html>
