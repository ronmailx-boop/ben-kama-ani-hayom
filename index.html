<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>בן כמה אני היום</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="bg-circles">
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>
  </div>

  <div class="container">
    <header>
      <h1>🎂 בן כמה אני היום?</h1>
      <p class="subtitle">הוסף אנשים וגלה את גילם המדויק</p>
    </header>

    <!-- Tabs -->
    <div class="tabs-wrapper">
      <div class="tabs" id="tabs"></div>
      <button class="add-btn" id="addBtn" title="הוסף אדם">+</button>
    </div>

    <!-- Content area -->
    <div class="card" id="mainCard">
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">👤</div>
        <p>לחץ על <strong>+</strong> כדי להוסיף אדם ראשון</p>
      </div>
      <div id="personView" class="person-view hidden">
        <div class="avatar" id="personAvatar"></div>
        <h2 id="personName"></h2>
        <div class="age-display" id="ageDisplay">
          <div class="age-block">
            <span class="age-number" id="ageYears">0</span>
            <span class="age-label">שנים</span>
          </div>
          <div class="age-sep">·</div>
          <div class="age-block">
            <span class="age-number" id="ageMonths">0</span>
            <span class="age-label">חודשים</span>
          </div>
          <div class="age-sep">·</div>
          <div class="age-block">
            <span class="age-number" id="ageDays">0</span>
            <span class="age-label">ימים</span>
          </div>
        </div>
        <div class="birthdate-label" id="birthdateLabel"></div>
        <button class="delete-btn" id="deleteBtn">🗑 הסר</button>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <h3>➕ הוסף אדם חדש</h3>
      <label>שם
        <input type="text" id="inputName" placeholder="לדוגמה: דנה" maxlength="20" />
      </label>
      <label>תאריך לידה
        <input type="date" id="inputDate" />
      </label>
      <p class="modal-error hidden" id="modalError"></p>
      <div class="modal-actions">
        <button class="btn-confirm" id="confirmBtn">הוסף</button>
        <button class="btn-cancel" id="cancelBtn">ביטול</button>
      </div>
    </div>
  </div>

  <!-- Popup -->
  <div class="popup hidden" id="popup">
    <span id="popupText"></span>
  </div>

  <script src="app.js"></script>
</body>
</html>
