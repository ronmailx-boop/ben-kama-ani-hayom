<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgeNow</title>

  <!-- PWA Manifest (Android + Chrome) -->
  <link rel="manifest" href="manifest.json" />

  <!-- Theme color for Chrome on Android -->
  <meta name="theme-color" content="#f7a823" />

  <!-- Apple / iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AgeNow" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/favicon.png?v=2" />

  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="bg-circles">
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>
  </div>

  <div class="container">
    <header>
      <button class="help-btn" id="helpBtn" type="button" aria-label="איך משתמשים?" title="איך משתמשים?">?</button>
      <h1>
        <svg class="logo-clock" viewBox="0 0 116 116" aria-hidden="true">
          <circle cx="58" cy="58" r="47" fill="#fdf4e3" stroke="#0f0e17" stroke-width="16" />
          <line x1="58" y1="58" x2="58" y2="28" stroke="#0f0e17" stroke-width="11" stroke-linecap="round" />
          <line x1="58" y1="58" x2="80" y2="69" stroke="#ff4d8d" stroke-width="11" stroke-linecap="round" />
          <circle cx="58" cy="58" r="8" fill="#0f0e17" />
        </svg>
        AgeNow
      </h1>
      <p class="subtitle">הוסף אנשים וגלה את גילם המדויק</p>
    </header>

    <!-- Tabs -->
    <div class="tabs-wrapper">
      <div class="tabs" id="tabs"></div>
      <button class="add-btn" id="addBtn" title="הוסף אדם">+</button>
    </div>

    <!-- Content area -->
    <div class="card" id="mainCard">
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">👤</div>
        <p>לחץ על <strong>+</strong> כדי להוסיף אדם ראשון</p>
      </div>
      <div id="personView" class="person-view hidden">
        <div class="avatar" id="personAvatar"></div>
        <h2 id="personName"></h2>
        <div class="age-display" id="ageDisplay">
          <div class="age-block">
            <span class="age-number" id="ageYears">0</span>
            <span class="age-label">שנים</span>
          </div>
          <div class="age-sep">·</div>
          <div class="age-block">
            <span class="age-number" id="ageMonths">0</span>
            <span class="age-label">חודשים</span>
          </div>
          <div class="age-sep">·</div>
          <div class="age-block">
            <span class="age-number" id="ageDays">0</span>
            <span class="age-label">ימים</span>
          </div>
        </div>
        <div class="birthdate-label" id="birthdateLabel"></div>
        <button class="delete-btn" id="deleteBtn">🗑 הסר</button>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <h3>➕ הוסף אדם חדש</h3>
      <label>שם
        <input type="text" id="inputName" placeholder="לדוגמה: דנה" maxlength="20" />
      </label>
      <label>תאריך לידה
        <input type="date" id="inputDate" />
      </label>
      <p class="modal-error hidden" id="modalError"></p>
      <div class="modal-actions">
        <button class="btn-confirm" id="confirmBtn">הוסף</button>
        <button class="btn-cancel" id="cancelBtn">ביטול</button>
      </div>
    </div>
  </div>

  <!-- Usage guide video -->
  <div class="modal-overlay hidden" id="guideOverlay">
    <div class="guide">
      <button class="guide-close" id="guideClose" type="button" aria-label="סגור">✕</button>
      <video id="guideVideo" src="media/guide.mp4?v=2" poster="media/guide-poster.jpg" controls playsinline preload="none"></video>
    </div>
  </div>

  <!-- Popup -->
  <div class="popup hidden" id="popup">
    <span id="popupText"></span>
  </div>

  <script src="app.js"></script>

  <!-- Cloudflare Web Analytics: anonymous visit counts, no cookies -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "6112fd9998754722afa9916fab7ef203"}'></script>
</body>
</html>
